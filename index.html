function save(coll,id,rec){
  rec.updatedBy=who();rec.updatedAt=new Date().toISOString();if(!rec.createdAt)rec.createdAt=rec.updatedAt;
  if(sb){
    if(!id)id=newId();
    localPut(coll,id,rec);later();
    return sb.from("docs").upsert({coll:coll,id:id,data:rec,updated_at:rec.updatedAt}).then(function(r){if(r.error){loadAll();throw sbErr(r.error);}});
  }

/* ---------- backup ---------- */
function backupText(){var o={app:"fundhaus-dashboard",at:new Date().toISOString(),data:{}};Object.keys(S).forEach(function(k){o.data[k]=data[k];});return JSON.stringify(o);}
function restore(text){
  var o;try{o=JSON.parse(text);}catch(e){o=null;}
  if(!o||o.app!=="fundhaus-dashboard"||!o.data){bmsg="That is not a FundHaus backup file.";render();return;}
  var rows=[],kept=0;
  Object.keys(o.data).forEach(function(k){
    if(!S[k])return;
    (o.data[k]||[]).forEach(function(r){
      var cur=byId(k,r.id);
      if(cur&&String(cur.updatedAt||"")>=String(r.updatedAt||"")){kept++;return;}
      var rec=Object.assign({},r);delete rec.id;rows.push({coll:k,id:r.id,data:rec,updated_at:rec.updatedAt||new Date().toISOString()});
    });
  });
  function done(fail){bmsg="Backup loaded: "+(rows.length-(fail||0))+" items added or updated, "+kept+" left alone because the copy here is the same or newer"+(fail?", "+fail+" did not save":"")+".";render();}
  if(!rows.length){done(0);return;}
  if(sb){
    var chunks=[];for(var i=0;i<rows.length;i+=200)chunks.push(rows.slice(i,i+200));
    chunks.reduce(function(pr,c){return pr.then(function(){return sb.from("docs").upsert(c).then(function(r){if(r.error)throw r.error;});});},Promise.resolve())
      .then(function(){return loadAll();}).then(function(){done(0);},function(){bmsg="The backup could not be loaded. Nothing more was changed.";loadAll();});
    return;
  }
  runJobs(rows.map(function(x){return function(){
    if(mem||!db){localPut(x.coll,x.id,x.data);return Promise.resolve();}
    return db.collection(x.coll).doc(x.id).set(x.data);};}),"Loading backup",done);
}

/* ---------- sorting ---------- */
function sorted(k){
  var a=data[k].slice(),t=today();
  function s(x){return String(x||"").toLowerCase();}
  if(k==="tasks")a.sort(function(x,y){return (x.status==="Done")-(y.status==="Done")||s(x.due||"9999").localeCompare(s(y.due||"9999"))||s(x.title).localeCompare(s(y.title));});
  else if(k==="sales"||k==="decisions")a.sort(function(x,y){return s(y.date).localeCompare(s(x.date));});
  else if(k==="calls"||k==="content")a.sort(function(x,y){var px=x.date<t,py=y.date<t;return px-py||(px?s(y.date).localeCompare(s(x.date)):s(x.date).localeCompare(s(y.date)));});
  else a.sort(function(x,y){return s(x.name).localeCompare(s(y.name));});
  return a;
}

/* ---------- payments: Stripe and Circle import ---------- */
function csv(text){
  var rows=[],row=[],cur="",inq=false;text=String(text).replace(/^﻿/,"");
  for(var i=0;i<text.length;i++){var ch=text[i];
    if(inq){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++;}else inq=false;}else cur+=ch;}
    else if(ch==='"')inq=true;
    else if(ch===","){row.push(cur);cur="";}
    else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&text[i+1]==="\n")i++;row.push(cur);cur="";if(row.length>1||row[0]!=="")rows.push(row);row=[];}
    else cur+=ch;}
  if(cur!==""||row.length){row.push(cur);rows.push(row);}
  return rows;
}
function colIdx(low,names,loose){
  for(var i=0;i<names.length;i++){var x=low.indexOf(names[i]);if(x>-1)return x;}
  if(loose)for(var j=0;j<names.length;j++){for(var c=0;c<low.length;c++)if(low[c].indexOf(names[j])>-1)return c;}
  return -1;
}
function toDate(v){
  v=String(v||"").trim();
  var m=/^(\d{4})-(\d\d)-(\d\d)(?:[ T](\d\d):(\d\d)(?::(\d\d))?)?/.exec(v);
  if(m){if(m[4])return iso(new Date(Date.UTC(+m[1],+m[2]-1,+m[3],+m[4],+m[5],+(m[6]||0))));return m[1]+"-"+m[2]+"-"+m[3];}
  m=/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/.exec(v);
  if(m){var y=m[3].length===2?"20"+m[3]:m[3];if(+m[2]>12||+m[1]>31)return "";return y+"-"+pad(+m[2])+"-"+pad(+m[1]);}
  return "";
}
function toNum(v){var n=parseFloat(String(v||"").replace(/[^0-9.\-]/g,""));return isNaN(n)?0:n;}
function findContact(email,name){
  var e=String(email||"").trim().toLowerCase(),n=String(name||"").trim().toLowerCase();
  return (e&&data.contacts.filter(function(c){return String(c.email||"").trim().toLowerCase()===e;})[0])||
         (n&&data.contacts.filter(function(c){return String(c.name||"").trim().toLowerCase()===n;})[0])||null;
}
function guessProduct(desc,amount,contactId){
  var d=String(desc||"").trim().toLowerCase();
  function newest(a){return a.sort(function(x,y){return String(y.updatedAt||"").localeCompare(String(x.updatedAt||""));})[0];}
  var prev=d?newest(data.sales.filter(function(x){return String(x.stripeDesc||"").trim().toLowerCase()===d;})):null;
  if(prev)return {p:prev.product,sure:true};
  var pc=contactId?newest(data.sales.filter(function(x){return x.contactId===contactId&&Number(x.amount)===Number(amount);})):null;
  if(pc)return {p:pc.product,sure:true};
  var kw=[["done for you","Done For You"],["course","Course"],["communit","Community"],["consult","Consulting call"],["coach","Coaching"],["member","Membership"],["subscription","Membership"]];
  for(var i=0;i<kw.length;i++)if(d.indexOf(kw[i][0])>-1)return {p:kw[i][1],sure:true};
  return {p:"",sure:false};
}
function attempt(job,n){
  return job().catch(function(e){
    if(e&&(e.code==="resource_exhausted"||e.code==="unavailable")&&n<4)return new Promise(function(r){setTimeout(r,2500*(n+1));}).then(function(){return attempt(job,n+1);});
    throw e;
  });
}

    imp=label+": "+i+" of "+jobs.length+" done. Keep this page open.";if(i%5===0)render();

  }

}

  data.sales.forEach(function(x){if(x.contactId&&(x.product==="Membership"||x.product==="Community")&&(!lastPay[x.contactId]||x.date>lastPay[x.contactId].date))lastPay[x.contactId]=x;});
  var rank={crit:0,warn:1,good:2,off:3};
  var rows=data.contacts.filter(function(c){return c.inCircle==="Yes"||c.payStatus==="Paying"||c.payStatus==="Check"||c.payStatus==="Free"||lastPay[c.id];}).map(function(c){
    var lp=lastPay[c.id],recent=lp&&lp.date>=cut,flag,tone;
    if(c.payStatus==="Free"){flag="Free access";tone="off";}
    else if(c.payStatus==="Cancelled"&&c.inCircle==="Yes"){flag="Cancelled but still in Circle";tone="crit";}
    else if(c.inCircle==="Yes"&&!recent){flag="In Circle, no payment in 45 days";tone="crit";}
    else if(c.payStatus==="Paying"&&!recent){flag="Marked paying, no payment found";tone="crit";}
    else if(recent&&c.inCircle!=="Yes"){flag="Paying, not marked in Circle";tone="warn";}
    else if(recent){flag="Paying";tone="good";}
    else{flag="Check";tone="warn";}
    return {c:c,lp:lp,flag:flag,tone:tone};
  }).sort(function(x,y){return rank[x.tone]-rank[y.tone]||String(x.c.name).localeCompare(String(y.c.name));});
  h+='<h2>Member check</h2><div class="sub" style="margin-bottom:8px">Everyone in Circle or marked as a member, against their last membership payment.</div>';
  if(!rows.length)h+='<div class="panel"><div class="empty">No members yet. Import the Circle members list to start the check.</div></div>';
  else{
    h+='<div class="tablewrap"><table><thead><tr><th>Name</th><th>In Circle</th><th>Status</th><th>Last payment</th><th class="num">Amount</th><th>Through</th><th>Check</th></tr></thead><tbody>';
    rows.forEach(function(x){
      h+='<tr data-open="'+esc(x.c.id)+'"><td class="first">'+esc(x.c.name)+"</td><td>"+pill(x.c.inCircle||"Unknown")+"</td><td>"+pill(x.c.payStatus)+'</td><td class="nowrap">'+(x.lp?fd(x.lp.date):'<span class="sub">none</span>')+
        '</td><td class="num">'+(x.lp?money(x.lp.amount):"")+"</td><td>"+esc(x.lp?x.lp.account||"Entered by hand":"")+'</td><td><span class="pill '+x.tone+'">'+x.flag+"</span></td></tr>";
    });
    h+='</tbody></table><div class="total"><span><b>'+rows.filter(function(x){return x.tone==="crit";}).length+"</b> need a look</span><span><b>"+rows.length+"</b> shown</span></div></div>";
  }
  var ign=data.payments.filter(function(x){return x.status==="Ignored";});
  if(ign.length){
    h+='<div class="panel" style="margin-top:14px"><h2>Not a sale <span class="sub">'+ign.length+'</span></h2><div class="rows">'+ign.slice(0,40).map(function(x){
      return '<div class="row" style="cursor:default"><span class="t">'+money(x.amount)+" · "+fd(x.date)+" · "+esc(x.name||x.email||x.desc||"")+'</span><button class="chip" data-putback="'+esc(x.id)+'">Put back</button></div>';}).join("")+"</div></div>";
  }
  return h;
}

/* ---------- monthly report ---------- */
function shiftMonth(m,d){var x=new Date(+m.slice(0,4),+m.slice(5)-1+d,1);return x.getFullYear()+"-"+pad(x.getMonth()+1);}
function monthName(m){return MON[+m.slice(5)-1]+" "+m.slice(2,4);}
function group(rows,key){
  var g={};rows.forEach(function(r){var k=r[key]||"Not set";g[k]=g[k]||{n:0,t:0};g[k].n++;g[k].t+=Number(r.amount)||0;});
  return Object.keys(g).map(function(k){return {k:k,n:g[k].n,t:g[k].t};}).sort(function(x,y){return y.t-x.t;});
}
function breakdown(title,gs){
  var max=gs.length?gs[0].t:0;
  return '<div class="panel"><h2>'+title+"</h2>"+(gs.length?gs.map(function(x){
    return '<div class="brow"><span>'+esc(x.k)+' <span class="sub">'+x.n+"</span></span><b>"+money(x.t)+'</b><div class="bar"><i style="width:'+(max?Math.round(x.t/max*100):0)+'%"></i></div></div>';}).join(""):'<div class="empty">No sales this month.</div>')+"</div>";
}
function report(){
  var m=repMonth||today().slice(0,7),pm=shiftMonth(m,-1),set=data.settings.filter(function(r){return r.id==="main";})[0]||{};
  function inM(v,mm){return String(v||"").slice(0,7)===(mm||m);}
  var sales=data.sales.filter(function(r){return inM(r.date);}),tot=sum(sales,"amount"),prev=sum(data.sales.filter(function(r){return inM(r.date,pm);}),"amount");
  var costs=sum(data.systems,"cost"),target=Number(set.target)||0,diff=tot-prev;
  var byP=group(sales,"product"),byS=group(sales,"source"),byW=group(sales,"by");
  var facts=[["New contacts added",data.contacts.filter(function(r){return inM(r.createdAt);}).length],
    ["Members who joined",data.contacts.filter(function(r){return inM(r.joined);}).length],
    ["Conversations logged",data.activity.filter(function(r){return inM(r.date);}).length],
    ["Community calls held",data.calls.filter(function(r){return inM(r.date)&&r.status==="Done";}).length],
    ["Content pieces published",data.content.filter(function(r){return inM(r.date)&&r.status==="Done";}).length],
    ["Tasks finished",data.tasks.filter(function(r){return r.status==="Done"&&inM(r.updatedAt);}).length],
    ["Sales from Stripe",sales.filter(function(r){return r.stripeId;}).length+" of "+sales.length]];
  lastReport=["FundHaus report, "+monthName(m),"Sales: "+money(tot)+" from "+sales.length+" sale"+(sales.length===1?"":"s")+(target?" (target "+money(target)+")":""),
    "Last month: "+money(prev),"Running costs: "+money(costs),"Working result: "+money(tot-costs),"",
    "By product: "+(byP.map(function(x){return x.k+" "+money(x.t);}).join(", ")||"none"),
    "By source: "+(byS.map(function(x){return x.k+" "+money(x.t);}).join(", ")||"none"),""].concat(facts.map(function(x){return x[0]+": "+x[1];})).join("\n");
  var h='<div class="head"><div><h1>Report, '+monthName(m)+'</h1><div class="sub">Working figures from what is recorded here, not accounts. Running costs use the monthly costs in Systems as they are today.</div></div>'+
    '<div class="chips"><button class="chip" data-rep="-1">Earlier month</button><button class="chip" data-rep="1">Later month</button><button class="btn ghost" data-repcopy="1">Copy summary</button></div></div>';
  h+='<div class="tiles">'+tile("Sales",money(tot),sales.length+" sale"+(sales.length===1?"":"s")+(target?", target "+money(target):""))+
    tile("Running costs",money(costs),"from Systems")+
    tile("Working result",money(tot-costs),"sales less running costs")+
    tile("Against "+monthName(pm),(diff>=0?"+":"-")+money(Math.abs(diff)),monthName(pm)+" was "+money(prev))+"</div>";
  h+='<div class="cols">'+breakdown("By product",byP)+breakdown("By how they found us",byS)+breakdown("By who delivered it",byW)+
    '<div class="panel"><h2>What happened</h2><div class="rows">'+facts.map(function(x){return '<div class="row" style="cursor:default"><span class="t">'+x[0]+'</span><span class="m"><b>'+x[1]+"</b></span></div>";}).join("")+"</div></div></div>";
  return h;
}

/* ---------- form ---------- */
var editing=null;
function openForm(k,id,preset){preset=preset||{};
  var sc=S[k],rec=id?byId(k,id):null;
  if(sc.single)id=sc.single;
  editing={k:k,id:id,isNew:!rec,armed:false,preset:preset,rec:rec};
  var h="<h2>"+(sc.single?sc.label:(rec?"Edit ":"Add ")+sc.one)+'</h2><div class="grid">';
  sc.fields.forEach(function(x){
    if(x.type==="head"){h+='<div class="fhead">'+x.label+"</div>";return;}
    var v=rec?rec[x.key]:preset[x.key]!==undefined?preset[x.key]:(x.today?today():x.key==="owner"?who():x.type==="select"?x.opts[0]:""),c;
    if(v==null)v="";
    if(x.type==="contact")c='<select id="f_'+x.key+'"><option value="">Choose a person</option>'+sorted("contacts").map(function(o){return '<option value="'+esc(o.id)+'"'+(o.id===v?" selected":"")+">"+esc(o.name)+"</option>";}).join("")+"</select>";
    else if(x.type==="select")c='<select id="f_'+x.key+'">'+x.opts.map(function(o){return "<option"+(o===v?" selected":"")+">"+esc(o)+"</option>";}).join("")+"</select>";
    else if(x.type==="area")c='<textarea id="f_'+x.key+'">'+esc(v)+"</textarea>";
    else if(x.type==="money"||x.type==="number")c='<input id="f_'+x.key+'" type="number" inputmode="decimal" step="'+(x.type==="money"?"0.01":"1")+'" min="0" value="'+esc(v)+'">';
    else c='<input id="f_'+x.key+'" type="'+(x.type==="date"?"date":"text")+'" value="'+esc(v)+'">';
    h+='<label class="'+(x.wide?"wide":"")+'" for="f_'+x.key+'">'+x.label+(x.type==="money"?" ($)":"")+c+"</label>";
  });
  h+='</div><div class="err" id="err" role="alert"></div>';
  if(rec&&rec.updatedBy)h+='<div class="sub">Last changed by '+esc(rec.updatedBy)+", "+fd(String(rec.updatedAt||"").slice(0,10))+"</div>";
  h+='<div class="actions">'+(rec&&!sc.single?'<button type="button" class="btn ghost" id="del">Delete</button>':"")+
    '<div class="right"><button type="button" class="btn ghost" id="cancel">Cancel</button><button class="btn" id="ok">Save</button></div></div>';
  document.getElementById("frm").innerHTML=h;
  var d=document.getElementById("dlg");if(!d.open)d.showModal();
}
function submit(){
  var sc=S[editing.k],rec={},bad="";
  if(editing.rec){rec=Object.assign({},editing.rec);delete rec.id;}
  Object.assign(rec,editing.preset);
  sc.fields.forEach(function(x){
    if(x.type==="head")return;
    var v=document.getElementById("f_"+x.key).value;
    if(x.type==="money"||x.type==="number"){v=v===""?"":Number(v);}else v=v.trim();
    if(x.req&&(v===""||v==null))bad=bad||x.label+" is needed.";
    rec[x.key]=v;
  });
  var err=document.getElementById("err");
  if(bad){err.textContent=bad;return;}
  if(editing.k==="activity"&&rec.kind!=="Note"&&rec.needsReply==="Yes"&&!rec.followUp)rec.followUp=addDays(rec.date,4);
  if(editing.isNew&&!editing.dupOk){
    var dup="";
    if(editing.k==="contacts"){
      var de=String(rec.email||"").toLowerCase(),dn=String(rec.name||"").toLowerCase();
      var dc=data.contacts.filter(function(c){return (de&&String(c.email||"").toLowerCase()===de)||String(c.name||"").toLowerCase()===dn;})[0];
      if(dc)dup=dc.name+" is already in Contacts.";
    }
    if(editing.k==="tasks"){
      var dt=String(rec.title||"").toLowerCase();
      if(data.tasks.some(function(x){return x.status!=="Done"&&String(x.title||"").toLowerCase()===dt;}))dup="There is already an open task with that name.";
    }
    if(dup){editing.dupOk=true;err.textContent=dup+" Press Save again to add it anyway.";return;}
  }
  var ok=document.getElementById("ok");ok.disabled=true;
  save(editing.k,editing.isNew&&!sc.single?null:editing.id,rec).then(function(){
      if(editing.k==="activity"&&rec.followUp&&rec.contactId)patch("contacts",rec.contactId,{next:rec.followUp}).catch(function(){});
      document.getElementById("dlg").close();},
    function(e){ok.disabled=false;err.textContent=failMsg(e);});
}

/* ---------- events ---------- */
document.getElementById("frm").addEventListener("submit",function(e){e.preventDefault();submit();});
document.getElementById("frm").addEventListener("click",function(e){
  if(e.target.id==="cancel")document.getElementById("dlg").close();
  if(e.target.id==="del"){
    if(!editing.armed){editing.armed=true;e.target.textContent="Click again to delete";e.target.className="btn danger";return;}
    var kill=editing.k==="contacts"?data.activity.filter(function(a){return a.contactId===editing.id;}):[];
    kill.reduce(function(p,a){return p.then(function(){return remove("activity",a.id);});},Promise.resolve()).then(function(){return remove(editing.k,editing.id);})
      .then(function(){if(editing.k==="contacts"){detailId=null;render();}document.getElementById("dlg").close();},function(x){document.getElementById("err").textContent=failMsg(x);});
  }
});
document.getElementById("main").addEventListener("click",function(e){
  var t=e.target;
  if(t.dataset.tick){
    var r=data.tasks.filter(function(x){return x.id===t.dataset.tick;})[0];if(!r)return;
    var c=Object.assign({},r);delete c.id;c.status=t.checked?"Done":"To do";
    save("tasks",r.id,c).catch(function(x){note=failMsg(x);render();});return;
  }
  if(t.dataset.pick){pick=t.dataset.pick;render();return;}
  if(t.dataset.done){hideDone=!hideDone;render();return;}
  if(t.dataset.stage||t.dataset.ch||t.id==="acct"||t.type==="file")return;
  if(t.dataset.login){doLogin(false);return;}
  if(t.dataset.pwopen){pwOpen=true;pwMsg="";render();return;}
  if(t.dataset.pwsave){changePw();return;}
  if(t.dataset.backup){
    var txt=backupText();
    if(db){try{navigator.clipboard.writeText(txt).then(function(){t.textContent="Backup copied";},function(){t.textContent="Copy was blocked";});}catch(x){t.textContent="Copy was blocked";}}
    else{var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"application/json"}));a.download="fundhaus-backup-"+today()+".json";document.body.appendChild(a);a.click();a.remove();}
    return;
  }
  if(t.dataset.goto){var g=t.dataset.goto;detailId=null;q="";if(g==="due"){tab="contacts";pick="Follow up due";}else{tab=g;pick="All";}render();window.scrollTo(0,0);return;}
  if(t.dataset.match){matchPayment(t.dataset.match);return;}
  if(t.dataset.ignore){patch("payments",t.dataset.ignore,{status:"Ignored"}).catch(function(x){imp=failMsg(x);render();});return;}
  if(t.dataset.putback){patch("payments",t.dataset.putback,{status:"To review"}).catch(function(x){imp=failMsg(x);render();});return;}
  if(t.dataset.rep){repMonth=shiftMonth(repMonth||today().slice(0,7),+t.dataset.rep);render();return;}
  if(t.dataset.repcopy){try{navigator.clipboard.writeText(lastReport).then(function(){t.textContent="Copied";},function(){t.textContent="Copy was blocked";});}catch(x){t.textContent="Copy was blocked";}return;}
  if(t.dataset.add){openForm(t.dataset.add,null);return;}
  if(t.dataset.back){detailId=null;render();return;}
  if(t.dataset.act){openForm("activity",null,{contactId:t.dataset.act});return;}
  if(t.dataset.newtask){openForm("tasks",null,{contactId:t.dataset.newtask});return;}
  if(t.dataset.newsale){var c=byId("contacts",t.dataset.newsale);openForm("sales",null,{contactId:t.dataset.newsale,customer:c?c.name:""});return;}
  if(t.dataset.copy){
    var em=shown.map(function(r){return r.email;}).filter(Boolean).join(", ");
    if(!em){t.textContent="No emails to copy";return;}
    try{navigator.clipboard.writeText(em).then(function(){t.textContent="Copied "+em.split(", ").length+" emails";},function(){t.textContent="Copy was blocked";});}catch(x){t.textContent="Copy was blocked";}
    return;
  }
  if(t.tagName==="A")return;
  var op=t.closest("[data-open]");if(op&&!t.closest("[data-edit]")){detailId=op.dataset.open;tab="contacts";q="";pick="All";gq="";document.getElementById("gq").value="";render();window.scrollTo(0,0);return;}
  var el=t.closest("[data-edit]");if(el)openForm(el.dataset.edit,el.dataset.id);
});
document.getElementById("main").addEventListener("change",function(e){
  var ct=e.target;
  if(ct.id==="acct"){acct=ct.value;return;}
  if(ct.dataset.ch){choice[ct.dataset.ch]=choice[ct.dataset.ch]||{};choice[ct.dataset.ch][ct.dataset.f]=ct.value;return;}
  if(ct.id==="restoreFile"){
    var bf=ct.files&&ct.files[0];if(!bf)return;
    var br=new FileReader();br.onload=function(){restore(br.result);};br.onerror=function(){bmsg="That file could not be read.";render();};br.readAsText(bf);return;
  }
  if(ct.id==="stripeFile"||ct.id==="circleFile"){
    var file=ct.files&&ct.files[0];if(!file)return;
    var which=ct.id,rd=new FileReader();
    rd.onload=function(){if(which==="stripeFile")importStripe(rd.result);else importCircle(rd.result);};
    rd.onerror=function(){imp="That file could not be read.";render();};
    imp="Reading "+file.name+".";rd.readAsText(file);return;
  }
  if(e.target.dataset.stage)patch("contacts",e.target.dataset.stage,{stage:e.target.value}).catch(function(x){note=failMsg(x);render();});
});
document.getElementById("signout").addEventListener("click",function(){if(sb)sb.auth.signOut();});
document.getElementById("main").addEventListener("keydown",function(e){
  if(e.key==="Enter"&&(e.target.id==="lpw"||e.target.id==="lem")){doLogin(false);return;}if(e.key==="Enter"&&e.target.classList.contains("card"))e.target.click();});
document.getElementById("main").addEventListener("input",function(e){if(e.target.id==="q"){q=e.target.value;render();}});
var whoEl=document.getElementById("who");
try{var w=localStorage.getItem("fh_who");if(w)whoEl.value=w;}catch(e){}
whoEl.addEventListener("change",function(){try{localStorage.setItem("fh_who",whoEl.value);}catch(e){}render();});
function route(){var h=location.hash.replace("#","");tab=TABS.indexOf(h)>-1?h:"overview";q="";pick="All";render();}
function go(t){tab=t;q="";pick="All";detailId=null;gq="";document.getElementById("gq").value="";render();}
var backTab="overview";
document.getElementById("gq").addEventListener("input",function(e){
  gq=e.target.value.trim();
  if(gq){if(tab!=="search")backTab=tab;tab="search";detailId=null;}else if(tab==="search")tab=backTab;
  render();
});
document.getElementById("nav").addEventListener("click",function(e){
  var a=e.target.closest("a");if(!a)return;e.preventDefault();
  var t=a.getAttribute("href").slice(1);go(t);
  try{if(location.hash!=="#"+t)location.hash=t;}catch(x){}
});
window.addEventListener("hashchange",function(){var h=location.hash.replace("#","");if(TABS.indexOf(h)>-1&&h!==tab)go(h);});
route();start();
})();
</script>
